name: Refresh WHO data
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_data.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data.json; git diff --cached --quiet || (git commit -m "Refresh WHO TB data" && git push)
